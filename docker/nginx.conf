# nginx does the same job as the Vite proxy in development:
# it serves the React app and forwards /api/... to the two services.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Check-in photos are max 5 MB, plus the other form fields
  client_max_body_size 6m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # The check-in page needs the camera and the location
  add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

  # The "/" at the end of proxy_pass removes the /api/... prefix,
  # e.g. /api/employee/auth/login -> employee-service /auth/login
  location /api/employee/ {
    proxy_pass http://employee-service:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/attendance/ {
    proxy_pass http://attendance-service:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The map's web worker is a .mjs file. nginx does not know this
  # extension, and the browser only runs it when it is sent as JavaScript.
  location ~* \.mjs$ {
    default_type application/javascript;
  }

  # React Router: unknown paths load index.html, the app shows the page
  location / {
    try_files $uri /index.html;
  }
}
