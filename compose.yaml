services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    ports:
      - "127.0.0.1:3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_ROOT_HOST: localhost

    secrets:
      - mysql_root_password
      - employee_db_password
      - attendance_db_password

    volumes:
      - mysql_data:/var/lib/mysql
      - type: bind
        source: ./docker/mysql/init.sh
        target: /docker-entrypoint-initdb.d/01-init.sh
        read_only: true
        bind:
          create_host_path: false

secrets:
  mysql_root_password:
    file: ./docker/secrets/mysql_root_password

  employee_db_password:
    file: ./docker/secrets/employee_db_password

  attendance_db_password:
    file: ./docker/secrets/attendance_db_password

volumes:
  mysql_data:
