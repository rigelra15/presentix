name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint, unit tests and build for all apps
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Make sure the Docker images still build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # compose.yaml points to the secret files, so they must exist
      - run: node scripts/setup-secrets.mjs

      - run: docker compose --profile app build
